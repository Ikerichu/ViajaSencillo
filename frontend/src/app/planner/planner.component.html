<section class="card planner-card">
  <div class="planner-header">
    <h2>✈️ Planificador de Viajes</h2>
    <p class="planner-subtitle">Configura tu viaje ideal y genera un itinerario personalizado</p>
  </div>

  <form (ngSubmit)="submit()" class="planner-form">
    <!-- Main Fields -->
    <div class="form-section">
      <h3>Detalles del viaje</h3>
      
      <div class="form-group">
        <label for="destination">
          <span class="label-icon">🏙️</span>
          Ciudad destino
        </label>
        <select 
          id="destination"
          [(ngModel)]="destination" 
          name="destination"
          required
        >
          <option value="" disabled selected>Selecciona un destino</option>
          <option *ngFor="let item of destinations" [value]="item">{{ item }}</option>
        </select>
      </div>

      <!-- Dates Row -->
      <div class="dates-row">
        <div class="form-group">
          <label for="start_date">
            <span class="label-icon">📅</span>
            Fecha inicio
          </label>
          <input 
            id="start_date"
            type="date" 
            [(ngModel)]="start_date" 
            name="start_date" 
            required 
          />
        </div>
        <div class="form-group">
          <label for="end_date">
            <span class="label-icon">📅</span>
            Fecha fin
          </label>
          <input 
            id="end_date"
            type="date" 
            [(ngModel)]="end_date" 
            name="end_date" 
            required 
          />
        </div>
      </div>

      <!-- Budget -->
      <div class="form-group">
        <label for="budget">
          <span class="label-icon">💰</span>
          Presupuesto total (€)
        </label>
        <input 
          id="budget"
          type="number" 
          [(ngModel)]="budget" 
          name="budget" 
          min="100" 
          placeholder="1000"
          required 
        />
      </div>
    </div>

    <!-- Interests Section -->
    <div class="form-section interests-section">
      <h3>🎯 Tus intereses</h3>
      <p class="interests-hint">Selecciona qué te interesa explorar</p>
      
      <div class="checkbox-grid">
        <label class="checkbox-item">
          <input type="checkbox" [(ngModel)]="interests.comida" name="comida" />
          <span class="checkbox-label">🍽️ Comida</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" [(ngModel)]="interests.cultura" name="cultura" />
          <span class="checkbox-label">🎨 Cultura</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" [(ngModel)]="interests.naturaleza" name="naturaleza" />
          <span class="checkbox-label">🌳 Naturaleza</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" [(ngModel)]="interests.fiesta" name="fiesta" />
          <span class="checkbox-label">🎉 Fiesta</span>
        </label>
      </div>
    </div>

    <!-- Submit & Messages -->
    <div class="form-actions">
      <button type="submit" [disabled]="loading" class="btn-submit">
        <span *ngIf="!loading">🚀 Generar itinerario</span>
        <span *ngIf="loading">⏳ Generando...</span>
      </button>
    </div>

    <div *ngIf="error" class="message error-message">{{ error }}</div>
    <div *ngIf="success" class="message success-message">{{ success }}</div>
  </form>
</section>
